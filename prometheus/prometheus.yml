global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]

  - job_name: campus-linux
    static_configs: [{targets: ["node-exporter:9100"]}]

  - job_name: campus-devices      # NETCONF/RESTCONF exporter
    static_configs: [{targets: ["campus-exporter:9200"]}]
